    name: openpos-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && cd packages/database && npx prisma generate && npx prisma migrate deploy
    startCommand: cd apps/api && npx tsx src/main.ts
    envVars:
