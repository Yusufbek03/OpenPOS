services:
  - type: web
    name: openpos-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && cd packages/database && npx prisma generate && npx prisma migrate deploy && cd ../../apps/api && npx tsc
    startCommand: cd apps/api && node dist/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: ADMIN_URL
        value: https://openpos-terminal.vercel.app
      - key: POS_URL
        value: https://openpos-terminal.vercel.app
      - key: KITCHEN_URL
        value: https://openpos-terminal.vercel.app
      - key: CUSTOMER_DISPLAY_URL
        value: https://openpos-terminal.vercel.app
    healthCheckPath: /health
