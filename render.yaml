        value: postgresql://postgres:hyy-JfC-g2L-s6j@db.ytanvpjxqfdxcvghmzny.supabase.co:5432/postgres
      - key: JWT_SECRET
        value: openpos-mn7k2x9p4r8t1w5q3j6y0b8n2m4vc9
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: ADMIN_URL
