upstream api {
    server api:3001;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # API proxy
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # WebSocket proxy
    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Admin dashboard (static files)
    location /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # POS terminal (static files)
    location /pos {
        alias /usr/share/nginx/html/pos;
        try_files $uri $uri/ /pos/index.html;
    }

    # Kitchen display (static files)
    location /kitchen {
        alias /usr/share/nginx/html/kitchen;
        try_files $uri $uri/ /kitchen/index.html;
    }

    # Customer display (static files)
    location /display {
        alias /usr/share/nginx/html/display;
        try_files $uri $uri/ /display/index.html;
    }

    # Root -> admin
    location = / {
        return 302 /admin;
    }

    # Health check
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
